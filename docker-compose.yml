services:
  cliente:
    build:
      context: ./cliente
    container_name: cliente_lan
    hostname: estacao-cliente
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - |
        ip route replace 172.20.20.0/24 via 172.20.10.254
        ip route replace 172.20.30.0/24 via 172.20.10.254
        exec sleep infinity
    networks:
      lan_cliente:
        ipv4_address: 172.20.10.10
    depends_on:
      - firewall
    restart: unless-stopped

  firewall:
    build:
      context: ./firewall
    container_name: firewall_gateway
    hostname: firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      lan_cliente:
        ipv4_address: 172.20.10.254
      lan_servidores:
        ipv4_address: 172.20.20.254
      dmz:
        ipv4_address: 172.20.30.254
    restart: unless-stopped

  nginx_dmz:
    build:
      context: ./dmz
    container_name: nginx_dmz
    hostname: servidor-web
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - |
        ip route replace 172.20.10.0/24 via 172.20.30.254
        ip route replace 172.20.20.0/24 via 172.20.30.254
        exec nginx -g 'daemon off;'
    networks:
      dmz:
        ipv4_address: 172.20.30.10
    depends_on:
      - firewall
    restart: unless-stopped

  banco_dados:
    image: postgres:16-alpine
    container_name: banco_dados_interno
    hostname: banco-dados
    environment:
      POSTGRES_DB: empresa
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha_local}
    networks:
      lan_servidores:
        ipv4_address: 172.20.20.10
    restart: unless-stopped
    # Não publicar a porta 5432 no host.
    # O acesso a partir de outras redes é bloqueado pelo firewall.

networks:
  lan_cliente:
    name: lan_cliente
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.10.0/24

  lan_servidores:
    name: lan_servidores
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.20.0/24

  dmz:
    name: rede_dmz
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.30.0/24
