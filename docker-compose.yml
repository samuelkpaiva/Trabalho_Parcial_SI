```yaml
services:
  cliente:
    build:
      context: ./cliente
    container_name: cliente_lan
    hostname: cliente
    networks:
      lan_cliente:
        ipv4_address: 172.26.10.10
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "ip route replace 172.26.20.0/24 via 172.26.10.254 &&
             ip route replace 172.26.30.0/24 via 172.26.10.254 &&
             tail -f /dev/null"
    depends_on:
      - firewall

  firewall:
    build:
      context: ./firewall
    container_name: firewall_gateway
    hostname: firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      lan_cliente:
        ipv4_address: 172.26.10.254
      lan_servidores:
        ipv4_address: 172.26.20.254
      dmz:
        ipv4_address: 172.26.30.254

  nginx:
    build:
      context: ./dmz
    container_name: nginx_dmz
    hostname: nginx-dmz
    cap_add:
      - NET_ADMIN
    networks:
      dmz:
        ipv4_address: 172.26.30.10
    command: >
      sh -c "ip route replace 172.26.10.0/24 via 172.26.30.254 &&
             ip route replace 172.26.20.0/24 via 172.26.30.254 &&
             nginx -g 'daemon off;'"
    depends_on:
      - firewall

  banco:
    image: postgres:16
    container_name: banco_dados
    hostname: banco
    environment:
      POSTGRES_DB: empresa
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha_local}
    networks:
      lan_servidores:
        ipv4_address: 172.26.20.10
    volumes:
      - dados_postgres:/var/lib/postgresql/data

networks:
  lan_cliente:
    name: lan_cliente
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.10.0/24

  lan_servidores:
    name: lan_servidores
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.20.0/24

  dmz:
    name: rede_dmz
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.30.0/24

volumes:
  dados_postgres:
```
