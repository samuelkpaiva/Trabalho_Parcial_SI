# docker-compose.yml - Ambiente de lab de Firewall Linux (Netfilter/iptables)
# Uso: docker compose up -d

services:

  # ============================================================
  # CONTAINER FIREWALL (gateway/roteador entre as redes)
  # ============================================================
  firewall:
    image: alpine:3.20                    # imagem leve com iptables
    container_name: firewall              # nome fixo do container
    cap_add:
      - NET_ADMIN                         # permissão para manipular iptables e rotas
    sysctls:
      - net.ipv4.ip_forward=1             # habilita encaminhamento de pacotes (roteamento)
    volumes:
      - ./firewall/entrypoint.sh:/entrypoint.sh:ro   # script que aplica as regras
    entrypoint: ["/bin/sh", "/entrypoint.sh"]         # executa o script ao subir
    networks:
      lan_cliente:
        ipv4_address: 172.28.1.1          # IP do firewall na rede do cliente
      dmz:
        ipv4_address: 172.28.2.1          # IP do firewall na rede DMZ
    restart: unless-stopped               # reinicia se cair

  # ============================================================
  # CONTAINER CLIENTE (estação de trabalho interna)
  # ============================================================
  cliente:
    image: alpine:3.20                    # imagem leve
    container_name: cliente               # nome fixo
    command: sleep infinity               # mantém o container rodando
    networks:
      lan_cliente:
        ipv4_address: 172.28.1.10         # IP fixo do cliente
    depends_on:
      - firewall                          # sobe depois do firewall
    restart: unless-stopped

  # ============================================================
  # CONTAINER WEB NA DMZ (servidor Nginx público/interno)
  # ============================================================
  dmz-web:
    image: nginx:alpine                   # Nginx leve
    container_name: dmz-web               # nome fixo
    volumes:
      - ./dmz-web/index.html:/usr/share/nginx/html/index.html:ro  # página de teste
    networks:
      dmz:
        ipv4_address: 172.28.2.10         # IP fixo do servidor web
    depends_on:
      - firewall
    restart: unless-stopped

  # ============================================================
  # CONTAINER BANCO NA DMZ (PostgreSQL isolado - só para demonstrar bloqueio)
  # ============================================================
  dmz-db:
    image: postgres:16-alpine             # PostgreSQL leve
    container_name: dmz-db                # nome fixo
    environment:
      POSTGRES_PASSWORD: senha123         # senha simples só para o lab
      POSTGRES_USER: lab                  # usuário
      POSTGRES_DB: labdb                  # banco
    networks:
      dmz:
        ipv4_address: 172.28.2.20         # IP fixo do banco
    depends_on:
      - firewall
    restart: unless-stopped

# ============================================================
# REDES ISOLADAS (bridge nativas do Docker)
# ============================================================
networks:
  lan_cliente:                            # Rede do Cliente (LAN interna)
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24           # faixa de IPs da LAN

  dmz:                                    # Rede DMZ (zona desmilitarizada)
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24           # faixa de IPs da DMZ
